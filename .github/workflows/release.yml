name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-package:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Validate tagged versions before packaging
        shell: bash
        run: |
          VERSION=$(node scripts/release-version.mjs --check)
          test "$GITHUB_REF_NAME" = "v$VERSION"
      - run: npm run test:release
      - run: dotnet restore NuGetPackageManager.slnx
      - run: dotnet format NuGetPackageManager.slnx --verify-no-changes --no-restore
      - run: dotnet test NuGetPackageManager.slnx --configuration Release --no-restore
      - name: Pack global tool
        run: dotnet pack dotnet/ManagedCode.NuGet.Tool/ManagedCode.NuGet.Tool.csproj --configuration Release --output artifacts
      - name: Smoke install global tool
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          dotnet tool install --tool-path "$RUNNER_TEMP/tools" --source artifacts nuget-manager --version "$VERSION"
          "$RUNNER_TEMP/tools/nuget-manager" --help
          node scripts/verify-live-feed.mjs "$RUNNER_TEMP/tools/nuget-manager"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Install browser for renderer regressions
        run: npx playwright install --with-deps chromium
      - name: Rendered responsive UI regressions
        run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-renderer-ui-evidence
          path: test-results/ui/
          if-no-files-found: ignore
      - run: npm run format:check
      - run: npm run package
      - name: VS Code host integration tests
        run: xvfb-run -a npm run test:host
      - name: Match tag to both package versions
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TOOL_VERSION=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' dotnet/ManagedCode.NuGet.Tool/ManagedCode.NuGet.Tool.csproj | head -n 1)
          test "$VERSION" = "$TOOL_VERSION"
          test "$GITHUB_REF_NAME" = "v$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: |
            artifacts/*.vsix
            artifacts/*.nupkg
          if-no-files-found: error

  github-release:
    needs: verify-and-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: artifacts
      - name: Publish GitHub release with VSIX and global tool package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          echo 'NuGet Package Manager for VS Code and the nuget-manager global tool share one .NET engine. Both hosts support reviewed updates of complete package families. This release contains the built and tested VSIX and global tool package; Marketplace and NuGet uploads run independently.' > "$RUNNER_TEMP/release-notes.md"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" artifacts/*.vsix artifacts/*.nupkg --clobber
            gh release edit "$GITHUB_REF_NAME" --prerelease=false --notes-file "$RUNNER_TEMP/release-notes.md"
          else
            gh release create "$GITHUB_REF_NAME" artifacts/*.vsix artifacts/*.nupkg --title "$GITHUB_REF_NAME" --prerelease=false --notes-file "$RUNNER_TEMP/release-notes.md"
          fi

  nuget-publish:
    needs: verify-and-package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: artifacts
      - name: Publish .NET global tool to NuGet.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        shell: bash
        run: |
          if [[ -z "$NUGET_API_KEY" ]]; then
            echo "NUGET_API_KEY is required to publish nuget-manager to NuGet.org." >&2
            exit 1
          fi
          dotnet nuget push artifacts/*.nupkg --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

  marketplace-publish:
    needs: github-release
    if: vars.MARKETPLACE_PUBLISH == 'true'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/marketplace.yml
    with:
      release_tag: ${{ github.ref_name }}
    secrets: inherit
